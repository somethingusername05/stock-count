<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock Count</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Look: pastel doodle home screen. Warm grey page, soft translucent tiles, white widget headers, ink-outlined sticker buttons. */
:root{
  --bg:#E5E0DA; --tile:rgba(255,255,255,.34); --paper:#FFFFFF; --fg:#2B2522; --muted:#8C837B; --line:rgba(43,37,34,.12);
  --outline:#2B2522; --tan:#ECCB9C; --orange:#DB8452; --blue:#7EA2C8; --blush:#F1AAA2; --olive:#83875A;
  --danger:#C0463B; --danger-soft:#F7DCD7; --input:#FBF8F3;
  --font:"Quicksand","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#26211E; --tile:rgba(255,255,255,.06); --paper:#3A322D; --fg:#F2EAE1; --muted:#A99E94; --line:rgba(255,255,255,.1);
  --outline:#D8CABD; --tan:#E2BF8E; --orange:#E79A6B; --blue:#93B4D6; --blush:#E79E97; --olive:#A4A877;
  --danger:#FF9C90; --danger-soft:#4A2925; --input:#2F2925; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;font-weight:500;letter-spacing:.01em;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{position:relative;display:flex;align-items:center;gap:16px;padding:6px 4px}
.mascot{flex:none;width:72px;height:72px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.16em;text-transform:lowercase}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.04em;line-height:1.5}
.deco{position:absolute;pointer-events:none}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--tile);border-radius:30px;padding:16px 20px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:lowercase;letter-spacing:.14em}
input,select{font:inherit;font-size:15px;font-weight:600;padding:8px 12px;border:1.5px solid var(--outline);border-radius:14px;background:var(--input);color:var(--fg);min-width:0}
input::placeholder{color:var(--muted);opacity:.6}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:999px;border:2px solid var(--outline);padding:8px 18px;font-weight:700;letter-spacing:.08em;text-transform:lowercase;
  box-shadow:0 3px 0 var(--outline);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--tan);color:#2B2522}
.ghost{background:var(--paper);color:var(--fg)}
.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);box-shadow:0 3px 0 var(--danger)}
.spacer{flex:1}
.msg{min-height:20px;font-size:13px;color:var(--muted);letter-spacing:.04em;padding:0 8px}
.msg:empty{min-height:0;margin:-10px 0}
#list{display:flex;flex-direction:column;gap:18px}
.msg.err{color:var(--danger);font-weight:600}
.cat{background:var(--tile);border-radius:28px;overflow:hidden}
.cat h2{display:flex;align-items:center;gap:12px;margin:0;padding:9px 22px;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--fg)}
.ico{width:32px;height:32px;flex:none;overflow:visible}
.ico>*:not(.e):not(.ck){stroke:var(--outline);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ico .e{fill:#2B2522}.ico .ck{fill:#F1AAA2}
.thead,.row{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(110px,1fr) 90px minmax(170px,1.3fr) 100px 28px;gap:10px;align-items:center;padding:10px 22px}
.thead{font-size:12px;font-weight:600;text-transform:lowercase;letter-spacing:.14em;color:var(--muted);padding-top:14px;padding-bottom:4px}
.thead div:nth-child(5){text-align:right}
.row{border-top:1.5px dashed var(--line)}
.thead + .row{border-top:0}
.name{font-weight:700;overflow-wrap:anywhere}
.term{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin-top:1px}
.last{color:var(--muted);font-size:13px;font-weight:600}
.box{display:flex;gap:6px;align-items:center}
.box label{flex-direction:row;align-items:center;gap:5px;text-transform:none;letter-spacing:.02em;font-size:12px;font-weight:600}
.box input{width:72px;padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums;border-radius:12px}
.used{justify-self:end;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.used:not(:empty){background:var(--tan);color:#2B2522;border-radius:999px;padding:3px 11px;font-size:13px}
.used.neg{background:var(--danger-soft);color:var(--danger)}
.del{background:none;border:0;box-shadow:none;color:var(--muted);padding:2px 6px;font-size:20px;line-height:1}
.del:hover{color:var(--danger)}
.del:active{transform:none;box-shadow:none}
.row .confirm button{padding:5px 12px;font-size:13px}
details.add{background:var(--tile);border-radius:28px;padding:16px 22px}
details.add summary{cursor:pointer;font-weight:700;letter-spacing:.14em;text-transform:lowercase;color:var(--fg);list-style:none;display:flex;align-items:center;gap:10px}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:"+";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--outline);background:var(--blush);color:#2B2522;font-size:18px;line-height:1}
details.add[open] summary::before{content:"–"}
.addgrid{display:grid;grid-template-columns:2fr 1.3fr 1.2fr 1fr auto;gap:12px;align-items:end;margin-top:16px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){
  h1{font-size:24px}
  .mascot{width:56px;height:56px}
  .thead{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"name del" "last last" "add add" "box box" "used used";row-gap:8px;padding:12px 18px}
  .row .name{grid-area:name}.row .last{grid-area:last}.row .addc{grid-area:add}.row .box:not(.addc){grid-area:box}.row .used{grid-area:used;justify-self:start}.row .del{grid-area:del}
  .row .last::before{content:"last week · ";letter-spacing:.08em}.row .used::before{content:"used · ";font-weight:500}
  .addc::before{content:"added";font-size:12px;color:var(--muted);width:76px;letter-spacing:.1em}
  .row .box:not(.addc)::before{content:"this week";font-size:12px;color:var(--muted);width:76px;letter-spacing:.1em}
  .addgrid{grid-template-columns:1fr 1fr}
  .row .used:empty{display:none}
  .row{grid-template-areas:"name del" "last last" "add add" "box box" "used used"}
  .cat h2{padding:13px 18px}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <svg class="mascot" viewBox="0 0 72 72" aria-hidden="true">
      <path d="M12 26 L36 16 L60 26 L60 56 Q60 60 56 60 L16 60 Q12 60 12 56 Z" fill="#ECCB9C" stroke="#2B2522" stroke-width="3" stroke-linejoin="round"/>
      <path d="M12 26 L36 34 L60 26 M36 34 L36 40" fill="none" stroke="#2B2522" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 26 L4 18 L28 9 L36 16" fill="#F6E2C3" stroke="#2B2522" stroke-width="3" stroke-linejoin="round"/>
      <path d="M60 26 L68 18 L44 9 L36 16" fill="#F6E2C3" stroke="#2B2522" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="27" cy="45" r="2.6" fill="#2B2522"/><circle cx="45" cy="45" r="2.6" fill="#2B2522"/>
      <ellipse cx="21" cy="50.5" rx="4" ry="2.6" fill="#F1AAA2"/><ellipse cx="51" cy="50.5" rx="4" ry="2.6" fill="#F1AAA2"/>
      <path d="M32.5 49 Q36 52.5 39.5 49" fill="none" stroke="#2B2522" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <svg class="deco" style="left:62px;top:-4px" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="#ECCB9C" stroke-width="3.2" stroke-linecap="round"/></svg>
    <svg class="deco" style="left:-8px;bottom:2px" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2 L11 5 L4 11 Z" fill="#7EA2C8"/></svg>
    <svg class="deco" style="right:6px;top:4px" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3 L12 6 L5 12 Z" fill="#DB8452"/></svg>
    <svg class="deco" style="right:44px;bottom:-6px" width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="#F1AAA2" stroke-width="3.2" stroke-linecap="round"/></svg>
    <div>
    <h1>Stock Count</h1>
    <p class="sub"><span class="num" id="counted">0</span> of <span class="num" id="total">0</span> items counted &nbsp;|&nbsp; Used = Last week + Added − This week. Bag/box + grams items show Used in grams.</p>
    </div>
  </header>

  <div class="bar">
    <label>Count date<input type="date" id="fDate"></label>
    <button class="primary" id="xlsxBtn" type="button">Make Excel file</button>
    <span class="spacer"></span>
    <span class="confirm" id="newWeek">
      <button class="ghost" id="newWeekBtn" type="button">Start new week</button>
    </span>
  </div>
  <div class="msg" id="msg" role="status"></div>

  <div id="list"></div>

  <details class="add">
    <summary>Add a new item</summary>
    <form class="addgrid" id="addForm" autocomplete="off">
      <label>Item name<input id="aName" required maxlength="60"></label>
      <label>Category<select id="aCat"></select></label>
      <label>Counted in<select id="aTerm"></select></label>
      <label>1 full pack (g)<input id="aPack" type="number" min="1" step="any" inputmode="decimal" placeholder="bag/box + g only"></label>
      <button class="primary" type="submit">Add</button>
      <label id="aNewCatWrap" hidden>New category name<input id="aNewCat" maxlength="30" placeholder="e.g. SYRUPS"></label>
    </form>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
// ---------- setup ----------
const TERMS = {can:["Cans","cans"], bottle:["Bottles","bottles"], box:["Boxes","boxes"], bag:["Bags","bags"],
  grams:["Grams","g"], piece:["Pieces","pcs"], "box+g":["Boxes","g"], "bag+g":["Bags","g"]};
const TERM_LABEL = {can:"can", bottle:"bottle", box:"box", bag:"bag", grams:"grams", piece:"piece", "box+g":"box + grams", "bag+g":"bag + grams"};
const COLS = ["Cans","Bottles","Boxes","Bags","Grams","Pieces"];
const KEY = "stockcount.v1";

// Starting list with the 01/11/2026 count as last week. [name, category, term, packGrams, lastQty, lastGrams]
const SEED = [
 ["Diet Coke","SOFT DRINKS","can",0,39],["Coke Zero","SOFT DRINKS","can",0,26],["Coke Classic","SOFT DRINKS","can",0,24],
 ["Sprite","SOFT DRINKS","can",0,19],["Solo","SOFT DRINKS","can",0,37],["Sparkling Water","SOFT DRINKS","bottle",0,29],
 ["Bia SG","BEER & WINE","can",0,16],["HN Beer","BEER & WINE","bottle",0,29],["Sauvignon Blanc","BEER & WINE","bottle",0,24],
 ["Rose","BEER & WINE","bottle",0,26],["Cuvee","BEER & WINE","bottle",0,23],["Shiraz","BEER & WINE","bottle",0,20],
 ["Smirnoff","SPIRITS","bottle",0,0.9],["Soho Lychee","SPIRITS","bottle",0,2],["Roku Gin","SPIRITS","bottle",0,0.45],
 ["Kahlua","SPIRITS","bottle",0,0.7],["Vok","SPIRITS","bottle",0,1.05],
 ["Whole Coconut","COCONUT","piece",0,1],["Nước Dừa","COCONUT","bag",0,7],["Dừa Top","COCONUT","grams",0,874.1],
 ["Cozy Trà Đào Cam","COZY TEA","box",0,7],["Cozy Trà Đào Hồng","COZY TEA","box+g",50,5,54.7],["Cozy Trà Xanh","COZY TEA","box+g",50,8,240.5],
 ["Cozy Trà Hương Nhài","COZY TEA","box+g",50,8,51.9],["Cozy Ô Long","COZY TEA","box+g",50,2,228.8],["Cozy Trà Vải","COZY TEA","box",0,2],
 ["Trà Xanh Lài","LOOSE TEA","grams",0,378.9],["Hồng Trà Túi Lọc","LOOSE TEA","grams",0,990.9],["Oolong Tea","LOOSE TEA","grams",0,546.9],
 ["Trà Hoa Cúc","LOOSE TEA","grams",0,303.1],["Mint","LOOSE TEA","grams",0,448.2],
 ["Matcha","POWDERS","bag+g",200,0,479.7],["Cacao","POWDERS","bag+g",200,2,79.4],["Bột Sữa Dừa","POWDERS","bag+g",500,1,53],
 ["Bột Sữa Khoai Môn","POWDERS","bag+g",500,0,450.7],["Bột Frappe","POWDERS","bag+g",500,1,303.1],["Bột Hoa Anh Đào","POWDERS","bag+g",500,1,0],
 ["Cafe Mixed","COFFEE","grams",0,1474.1],["Cà Phê Muối","COFFEE","grams",0,291.1],["Cafe Nâu","COFFEE","bag",0,3],["Cafe Bạc","COFFEE","bag",0,3],
 ["Thạch Dừa","TOPPINGS","box",0,3],["Thạch Xanh","TOPPINGS","box",0,2],["Thạch Đen","TOPPINGS","box",0,2],["Hạt Đác","TOPPINGS","box",0,2],
 ["Kumquat","TOPPINGS","box",0,9],["Plum Base","TOPPINGS","box",0,1],
 ["Đào","CANNED","can",0,6],["Nhãn","CANNED","can",0,4],["Vải","CANNED","can",0,2],["Thốt Nốt","CANNED","can",0,2],["Mít","CANNED","can",0,2],["Sữa Đặc","CANNED","can",0,17],
];

const $ = id => document.getElementById(id);
const isNum = v => typeof v === "number" && isFinite(v);
const r2 = v => Math.round(v * 100) / 100;
let state;

function seedState(){
  return {lastDate:"2026-11-01", items: SEED.map(([name,cat,term,pack,lq,lg], i) => ({
    id: "i" + i, name, cat, term, pack: pack || null,
    last: {qty: lq, grams: term.endsWith("+g") ? (lg ?? 0) : null},
    added: null, qty: null, grams: null }))};
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) return s; } catch(e){}
  return seedState();
}
let saveOk = true;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); saveOk = true; }
  catch(e){ if (saveOk) setMsg("This browser isn't saving (private window?). Make the Excel file before closing.", true); saveOk = false; }
}
function setMsg(t, err){ $("msg").textContent = t || ""; $("msg").className = "msg" + (err ? " err" : ""); }

// ---------- maths ----------
const packed = it => it.term.endsWith("+g");
function counted(it){ return isNum(it.qty) || isNum(it.grams); }
function lastCounted(it){ return it.last && (isNum(it.last.qty) || isNum(it.last.grams)); }
function total(it, o){ return (o.qty || 0) * (it.pack || 0) + (o.grams || 0); }
function used(it){
  if (!counted(it) || !lastCounted(it)) return null;
  const add = isNum(it.added) ? it.added : 0;
  if (packed(it)) { if (!it.pack) return null; return r2(total(it, it.last) + add * it.pack - total(it, it)); }
  return r2((it.last.qty || 0) + add - (it.qty || 0));
}
function fmt(v){ return (Math.round(v*100)/100).toLocaleString("en-AU", {maximumFractionDigits:2}); }
function describe(it, o){
  if (!o || (!isNum(o.qty) && !isNum(o.grams))) return "not counted";
  const u = TERMS[it.term][1];
  if (packed(it)) {
    const p = [];
    const bag = it.term.startsWith("bag");
    if (o.qty) p.push(`${fmt(o.qty)} ${o.qty === 1 ? (bag ? "bag" : "box") : (bag ? "bags" : "boxes")}`);
    if (isNum(o.grams) && (o.grams || !o.qty)) p.push(`${fmt(o.grams)} g`);
    return p.join(" + ");
  }
  if (it.term === "grams") return `${fmt(o.qty)} g`;
  const one = {can:"can",bottle:"bottle",box:"box",bag:"bag",piece:"piece"}[it.term];
  return `${fmt(o.qty)} ${o.qty === 1 ? one : TERMS[it.term][1]}`;
}
function usedUnit(it){ return packed(it) || it.term === "grams" ? "g" : TERMS[it.term][1]; }

// ---------- category doodles (picked by keywords in the category name) ----------
const face = (x, y) => `<circle class="e" cx="${x-2.6}" cy="${y}" r="1.15"/><circle class="e" cx="${x+2.6}" cy="${y}" r="1.15"/>` +
  `<ellipse class="ck" cx="${x-4.6}" cy="${y+2.2}" rx="1.7" ry="1.1"/><ellipse class="ck" cx="${x+4.6}" cy="${y+2.2}" rx="1.7" ry="1.1"/>` +
  `<path fill="none" d="M${x-1.1} ${y+1.4} Q${x} ${y+2.6} ${x+1.1} ${y+1.4}"/>`;
const DOODLES = [
  [/SOFT|SODA|DRINK/, `<path fill="none" d="M18 8 L20 2.5 L24.5 2.5"/><rect x="9" y="7" width="14" height="22" rx="3" fill="#EFA08F"/><path fill="none" d="M9 11 H23 M9 25 H23"/>` + face(16, 17.5)],
  [/BEER|WINE/, `<path fill="none" d="M21 15 H24 A3 3 0 0 1 27 18 V21 A3 3 0 0 1 24 24 H21"/><rect x="6" y="11" width="15" height="18" rx="2.5" fill="#F2C46B"/><path fill="#FFFFFF" d="M5 12.5 Q4 8 8.5 8.5 Q10.5 4.5 14.5 6.5 Q18 4 20.5 8 Q24 8.5 22 12.5 Z"/>` + face(13.5, 19)],
  [/SPIRIT|LIQUOR|VODKA|GIN/, `<path fill="#BFCDA3" d="M13 5 H19 V9 Q24 11 24 16 V27 Q24 29 22 29 H10 Q8 29 8 27 V16 Q8 11 13 9 Z"/><rect x="12.5" y="1.5" width="7" height="4" rx="1" fill="#D9AE74"/><rect x="9" y="16.5" width="14" height="9" rx="1.5" fill="#FFFFFF"/>` + face(16, 20)],
  [/COCONUT|DỪA|DUA/, `<path fill="none" d="M19 13 L22 3 L26 3"/><circle cx="16" cy="18" r="11" fill="#B08560"/><ellipse cx="16" cy="13" rx="9.2" ry="3.2" fill="#FFF8EA"/>` + face(16, 20.5)],
  [/COZY|TEA ?BAG|TÚI LỌC/, `<path fill="none" d="M17 12 Q18.5 7 22 6.5"/><rect x="21" y="3" width="6" height="5" rx="1" fill="#ECCB9C"/><path fill="none" d="M24 14 A3.5 3.5 0 0 1 24 21"/><path fill="#F7D9D2" d="M6 12 H24 V17 A9 9 0 0 1 6 17 Z"/><path fill="none" d="M3 28.5 H27"/>` + face(15, 17)],
  [/TEA|TRÀ|LEAF/, `<path fill="#A9C08A" d="M5 27 Q4 7 27 5 Q27 27 5 27 Z"/><path fill="none" d="M5 27 Q9 23 12 20"/>` + face(17, 15.5)],
  [/POWDER|BỘT|MATCHA/, `<path fill="#C9DBA8" d="M9 9 H23 L25 27 Q25 29 23 29 H9 Q7 29 7 27 Z"/><rect x="8" y="4" width="16" height="5" rx="1.2" fill="#FFFFFF"/><path fill="none" d="M11 6.5 H21"/>` + face(16, 19)],
  [/COFFEE|CAFE|CÀ PHÊ/, `<path fill="none" d="M12 9.5 Q10.5 7.5 12 5.5 Q13.5 3.5 12 1.5 M18 9.5 Q16.5 7.5 18 5.5 Q19.5 3.5 18 1.5"/><path fill="none" d="M24 15 H25 A3 3 0 0 1 25 21 H24"/><path fill="#C69C74" d="M6 12 H24 V22 A6 6 0 0 1 18 28 H12 A6 6 0 0 1 6 22 Z"/>` + face(15, 19)],
  [/TOPPING|JELLY|THẠCH/, `<path fill="none" d="M16 6 Q17 2.5 20 2"/><path fill="#F4C9A0" d="M8 25 Q7 9 16 8.5 Q25 9 24 25 Z"/><path fill="none" d="M4.5 26.5 H27.5"/><circle cx="16" cy="7.5" r="2.6" fill="#E26B5C"/>` + face(16, 18.5)],
  [/CAN/, `<rect x="7" y="9" width="18" height="19" rx="2" fill="#9FBBD8"/><ellipse cx="16" cy="9" rx="9" ry="2.6" fill="#DCE6F0"/><rect x="7" y="15" width="18" height="8" fill="#FFFFFF"/>` + face(16, 18.5)],
];
const BOX_DOODLE = `<path fill="#ECCB9C" d="M5 12 L16 8 L27 12 V27 Q27 29 25 29 H7 Q5 29 5 27 Z"/><path fill="none" d="M5 12 L16 15 L27 12"/>` + face(16, 21.5);
function iconFor(cat){
  const hit = DOODLES.find(([re]) => re.test(cat.toUpperCase()));
  return `<svg class="ico" viewBox="0 0 32 32" aria-hidden="true">${hit ? hit[1] : BOX_DOODLE}</svg>`;
}

// ---------- render ----------
function categories(){
  const seen = []; for (const it of state.items) if (!seen.includes(it.cat)) seen.push(it.cat); return seen;
}
function numInput(it, field, unit, label){
  const lab = document.createElement("label");
  const inp = document.createElement("input");
  inp.type = "number"; inp.step = "any"; inp.min = "0"; inp.inputMode = "decimal"; inp.placeholder = "–";
  inp.id = `${field}-${it.id}`; inp.setAttribute("aria-label", `${it.name} ${label || unit}`);
  if (isNum(it[field])) inp.value = it[field];
  inp.addEventListener("input", () => {
    const v = inp.value === "" ? null : Number(inp.value);
    it[field] = isFinite(v) ? v : null; save(); refreshRow(it); refreshCount();
  });
  lab.append(inp);
  if (unit) { const s = document.createElement("span"); s.textContent = unit; lab.append(s); }
  return lab;
}
const rowEls = {};
function render(){
  const list = $("list"); list.innerHTML = "";
  for (const cat of categories()){
    const sec = document.createElement("section"); sec.className = "cat";
    const h = document.createElement("h2"); h.innerHTML = iconFor(cat); h.append(cat); sec.append(h);
    const th = document.createElement("div"); th.className = "thead";
    for (const t of ["Item","Last week","Added","This week","Used",""]) { const d = document.createElement("div"); d.textContent = t; th.append(d); }
    sec.append(th);
    for (const it of state.items.filter(i => i.cat === cat)){
      const row = document.createElement("div"); row.className = "row";
      const name = document.createElement("div"); name.className = "name"; name.textContent = it.name;
      const term = document.createElement("span"); term.className = "term";
      term.textContent = TERM_LABEL[it.term] + (packed(it) ? ` · 1 ${it.term.startsWith("bag") ? "bag" : "box"} = ${it.pack ?? "?"} g` : "");
      name.append(term);
      const last = document.createElement("div"); last.className = "last";
      const addc = document.createElement("div"); addc.className = "box addc";
      addc.append(numInput(it, "added", "", "added"));
      const box = document.createElement("div"); box.className = "box";
      if (packed(it)) box.append(numInput(it, "qty", TERMS[it.term][0].toLowerCase()), numInput(it, "grams", "g"));
      else box.append(numInput(it, "qty", TERMS[it.term][1]));
      const u = document.createElement("div"); u.className = "used";
      const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "×";
      del.setAttribute("aria-label", "Remove " + it.name);
      del.onclick = () => askRemove(it, row, del);
      row.append(name, last, addc, box, u, del); sec.append(row);
      rowEls[it.id] = {last, u};
      refreshRow(it);
    }
    list.append(sec);
  }
  refreshCount(); fillAddForm();
}
function refreshRow(it){
  const e = rowEls[it.id]; if (!e) return;
  e.last.textContent = describe(it, it.last);
  const v = used(it);
  e.u.textContent = v === null ? "" : `${fmt(v)} ${usedUnit(it)}`;
  e.u.classList.toggle("neg", v !== null && v < 0);
}
function refreshCount(){
  $("counted").textContent = state.items.filter(counted).length;
  $("total").textContent = state.items.length;
}
function askRemove(it, row, del){
  const c = document.createElement("span"); c.className = "confirm";
  const yes = document.createElement("button"); yes.className = "danger"; yes.type = "button"; yes.textContent = "Remove";
  const no = document.createElement("button"); no.className = "ghost"; no.type = "button"; no.textContent = "Keep";
  yes.onclick = () => { state.items = state.items.filter(i => i !== it); save(); render(); setMsg(`Removed ${it.name}.`); };
  no.onclick = () => c.replaceWith(del);
  c.append(yes, no); del.replaceWith(c);
}

// ---------- add item ----------
function fillAddForm(){
  const cur = $("aCat").value; $("aCat").innerHTML = "";
  for (const c of categories()) $("aCat").add(new Option(c, c));
  $("aCat").add(new Option("+ New category", "__new"));
  if (cur) $("aCat").value = cur;
  if (!$("aTerm").options.length) for (const [k, v] of Object.entries(TERM_LABEL)) $("aTerm").add(new Option(v, k));
}
$("aCat").addEventListener("change", () => { $("aNewCatWrap").hidden = $("aCat").value !== "__new"; });
$("addForm").addEventListener("submit", ev => {
  ev.preventDefault();
  const name = $("aName").value.trim(); if (!name) return;
  let cat = $("aCat").value;
  if (cat === "__new") { cat = $("aNewCat").value.trim().toUpperCase(); if (!cat) return setMsg("Type a name for the new category.", true); }
  if (state.items.some(i => i.name.toLowerCase() === name.toLowerCase())) return setMsg(`${name} is already on the list.`, true);
  const term = $("aTerm").value, pack = Number($("aPack").value) || null;
  if (term.endsWith("+g") && !pack) return setMsg("Type how many grams are in one full bag/box.", true);
  const idx = state.items.map(i => i.cat).lastIndexOf(cat);
  const it = {id: "n" + Date.now(), name, cat, term, pack, last: null, added: null, qty: null, grams: null};
  if (idx === -1) state.items.push(it); else state.items.splice(idx + 1, 0, it);
  save(); render(); $("aName").value = ""; $("aPack").value = ""; setMsg(`Added ${name}.`);
});

// ---------- start new week ----------
function newWeekButton(){
  const box = $("newWeek"); box.innerHTML = "";
  const b = document.createElement("button"); b.className = "ghost"; b.type = "button"; b.textContent = "Start new week";
  b.addEventListener("click", askNewWeek); box.append(b);
}
function askNewWeek(){
  const n = state.items.filter(counted).length;
  const box = $("newWeek"); box.innerHTML = "";
  const t = document.createElement("span"); t.textContent = n < state.items.length
    ? `${state.items.length - n} items aren't counted. Start a new week anyway?` : "Move this count to Last week?";
  const yes = document.createElement("button"); yes.className = "primary"; yes.type = "button"; yes.textContent = "Yes, new week";
  const no = document.createElement("button"); no.className = "ghost"; no.type = "button"; no.textContent = "Cancel";
  no.onclick = newWeekButton;
  yes.onclick = () => {
    for (const it of state.items) {
      it.last = counted(it) ? {qty: it.qty, grams: packed(it) ? (it.grams ?? 0) : null} : null;
      it.qty = it.grams = it.added = null;
    }
    state.lastDate = $("fDate").value; save(); render(); newWeekButton();
    setMsg("New week started. Last week now shows the count you just finished.");
  };
  box.append(t, yes, no);
}
newWeekButton();

// ---------- Excel (same layout as the owner's stock file) ----------
async function makeExcel(){
  if (typeof ExcelJS === "undefined") return setMsg("The Excel maker didn't load. Check the internet connection and reload.", true);
  const date = $("fDate").value; const [y, m, d] = date.split("-");
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(`Stock ${d}-${m}-${y}`, {views: [{state: "frozen", xSplit: 1, ySplit: 4, showGridLines: false}]});
  const A = {name: "Arial", size: 10}, NAVY = "FF1F4E78", GREEN = "FF2E7D32", ORANGE = "FFC55A11";
  const B = {style: "thin", color: {argb: "FFBFBFBF"}}, border = {top: B, bottom: B, left: B, right: B};
  ws.getCell("A1").value = `Stock Count ${d}/${m}/${y}`; ws.getCell("A1").font = {name: "Arial", size: 14, bold: true, color: {argb: NAVY}};
  ws.getCell("A2").value = "Used = Last Week + Added − This Week. Bag/box + grams items: Used is in grams. Red = more stock than expected: check for a missing delivery or a count mistake.";
  ws.getCell("A2").font = {...A, italic: true, color: {argb: "FF595959"}};
  const head = (cell, text, color) => { const c = ws.getCell(cell); c.value = text; c.font = {...A, bold: true, color: {argb: "FFFFFFFF"}};
    c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: color}}; c.alignment = {horizontal: "center", vertical: "middle", wrapText: true}; c.border = border; };
  head("A3", "Item", NAVY); head("B3", "Last Week", ORANGE); head("C3", "Added", GREEN); head("D3", "This Week Count", NAVY); head("J3", "Used", ORANGE);
  COLS.forEach((u, i) => head(String.fromCharCode(68 + i) + "4", u, NAVY));
  ws.mergeCells("A3:A4"); ws.mergeCells("B3:B4"); ws.mergeCells("C3:C4"); ws.mergeCells("D3:I3"); ws.mergeCells("J3:J4");
  let r = 5;
  for (const cat of categories()) {
    const cr = ws.getRow(r++); cr.getCell(1).value = cat;
    for (let c = 1; c <= 10; c++) { const x = cr.getCell(c); x.fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FFDDEBF7"}}; x.font = {...A, bold: true, color: {argb: NAVY}}; x.border = border; }
    for (const it of state.items.filter(i => i.cat === cat)) {
      const row = ws.getRow(r++);
      row.getCell(1).value = it.name;
      row.getCell(2).value = describe(it, it.last);
      if (isNum(it.added)) { row.getCell(3).value = it.added; row.getCell(3).numFmt = `General" ${packed(it) ? TERMS[it.term][0].toLowerCase() : TERMS[it.term][1]}"`; }
      const main = 4 + COLS.indexOf(TERMS[it.term][0]);
      if (isNum(it.qty)) row.getCell(main).value = it.qty;
      if (packed(it) && isNum(it.grams)) row.getCell(8).value = it.grams;
      const v = used(it);
      if (v !== null) { const c = row.getCell(10); c.value = v; c.numFmt = `General" ${usedUnit(it)}"`;
        if (v < 0) { c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: "FFFCE4E4"}}; c.font = {...A, bold: true, color: {argb: "FFC00000"}}; } }
      for (let c = 1; c <= 10; c++) { const x = row.getCell(c); if (!(c === 10 && v < 0)) x.font = {...A, bold: c === 3 || c === 10, color: {argb: c === 3 ? GREEN : c === 2 ? "FF595959" : "FF000000"}};
        x.border = border; x.alignment = {horizontal: c === 1 ? "left" : "center", vertical: "middle"}; }
    }
  }
  [24, 20, 12, 8, 9, 8, 8, 10, 8, 12].forEach((w, i) => ws.getColumn(i + 1).width = w);
  const ps = wb.addWorksheet("Pack Sizes");
  ps.addRow(["Item", "1 full pack (g)"]).eachCell(c => { c.font = {...A, bold: true, color: {argb: "FFFFFFFF"}}; c.fill = {type: "pattern", pattern: "solid", fgColor: {argb: NAVY}}; });
  for (const it of state.items.filter(packed)) ps.addRow([it.name, it.pack]);
  ps.getColumn(1).width = 24; ps.getColumn(2).width = 16;
  const buf = await wb.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  const a = document.createElement("a"); a.href = url; a.download = `Stock_Count_${date}.xlsx`; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  setMsg(`Downloaded Stock_Count_${date}.xlsx.`);
}
$("xlsxBtn").addEventListener("click", () => { $("xlsxBtn").disabled = true; makeExcel().catch(() => setMsg("The Excel file couldn't be made.", true)).finally(() => $("xlsxBtn").disabled = false); });

// ---------- start ----------
state = load();
(() => { const t = new Date(); $("fDate").value = new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); })();
render();
</script>
</body>
